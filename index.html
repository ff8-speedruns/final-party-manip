<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Work out the tilt inputs for the FF8 final party manipulation." />
    <title>FF8 Final Party Manipulation</title>
    <script>
      // Resolve the saved colour scheme before first paint. Shared key, so the
      // choice carries over from the hub. See @ff8-speedruns/ui.
      try {
        var s = window.localStorage.getItem('ff8-color-scheme');
        var scheme = s === 'light' || s === 'dark' || s === 'auto' ? s : 'auto';
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        );
      } catch (e) {}
    </script>

</html>
